{% load static %}
<section id="fun-fact" class="relative section-padding-primary bg-[url('../images/backgrounds/about-img.jpg')] bg-cover bg-no-repeat bg-center before:absolute before:inset-0 before:bg-[#000f29d6] before:w-full before:h-full bg-fixed overflow-hidden">
      <div class="container relative">
        <ul class="grid lg:grid-cols-4 sm:grid-cols-2 gap-6">
          <!-- Item 1 -->
          <li class="flex items-center gap-6" data-animation="slideInUp">
            <div class="w-24 h-24 bg-glass rounded-xl grid place-items-center backdrop-blur-lg">
              <img src="{% static 'image/love.svg' %}" alt="Happy Clients">
            </div>
            <div>
              <h2 class="text-white text-5xl font-semibold fun-fact__number" data-count="520">0</h2>
              <p class="text-gray-200 text-lg">Happy Clients</p>
            </div>
          </li>

          <!-- Item 2 -->
          <li class="flex items-center gap-6" data-animation="slideInUp" data-animation-delay="300ms">
            <div class="w-24 h-24 bg-glass rounded-xl grid place-items-center backdrop-blur-lg">
              <img src="{% static 'image/policy.svg' %}" alt="Projects Done">
            </div>
            <div>
              <h2 class="text-white text-5xl font-semibold fun-fact__number" data-count="850">0</h2>
              <p class="text-gray-200 text-lg">Projects Completed</p>
            </div>
          </li>

          <!-- Item 3 -->
          <li class="flex items-center gap-6" data-animation="slideInUp" data-animation-delay="600ms">
            <div class="w-24 h-24 bg-glass rounded-xl grid place-items-center backdrop-blur-lg">
              <img src="{% static 'image/worker.svg' %}" alt="Team Members">
            </div>
            <div>
              <h2 class="text-white text-5xl font-semibold fun-fact__number" data-count="45">0</h2>
              <p class="text-gray-200 text-lg">Expert Team Members</p>
            </div>
          </li>

          <!-- Item 4 -->
          <li class="flex items-center gap-6" data-animation="slideInUp" data-animation-delay="900ms">
            <div class="w-24 h-24 bg-glass rounded-xl grid place-items-center backdrop-blur-lg">
              <img src="{% static 'image/badge.svg' %}" alt="Awards Won">
            </div>
            <div>
              <h2 class="text-white text-5xl font-semibold fun-fact__number" data-count="25">0</h2>
              <p class="text-gray-200 text-lg">Awards Won</p>
            </div>
          </li>
        </ul>
      </div>
    </section>
