{% load static %}
<section id="brands" class="section-padding-primary bg-gray-50">
      <div class="container">
        <!-- TITLE START -->
        <div class="title__box mb-16 text-center" data-animation="slideInUp">
          <div data-animation="slideInUp" class="title__box mb-4 justify-center items-center text-center mx-auto">
            <!-- Subtitle -->
            <div class="title__box-subtitle-box">
              <i class="fa-solid fa-star text-sm"></i> 
              <span class="title__box-subtitle">
                Our Satisfied Partners
              </span>
            </div>

            <!-- Title -->
            <h2 class="title__box-title Trusted by Clients WorldwideClass">
              Trusted by Clients Worldwide
            </h2>
          </div>

          <p class="text-small-text max-w-2xl mx-auto">
            We are proud to collaborate with industry leaders and innovative startups globally. Our commitment to excellence has built long-lasting partnerships with over 500+ companies.
          </p>
        </div>
        <!-- TITLE END -->

        <!-- Marquee Slider Wrapper -->
        <div class="overflow-x-hidden relative">
          <!-- Optional: Gradient Fade on sides for smooth effect -->
          <div class="absolute left-0 top-0 bottom-0 w-20 bg-gradient-to-r from-gray-50 to-transparent z-10 pointer-events-none"></div>
          <div class="absolute right-0 top-0 bottom-0 w-20 bg-gradient-to-l from-gray-50 to-transparent z-10 pointer-events-none"></div>

          <div class="relative" style="mask-image: linear-gradient(to right, rgba(0,0,0,0), #000 15%, #000 85%, rgba(0,0,0,0));">
            <div class="w-full flex items-center gap-16 animate-[LoopSlide_30s_linear_infinite] hover:[animation-play-state:paused]">
              <!-- Set 1 -->
              <img src="{% static 'image/brand-1.jpg' %}" alt="TechNova Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-2.jpg' %}" alt="GlobalCorp Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-3.jpg' %}" alt="Nexus Systems Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-4.jpg' %}" alt="Apex Solutions Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-5.jpg' %}" alt="Vertex Group Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-6.jpg' %}" alt="Quantum Dynamics Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
          
              <!-- Set 2 (Duplicate for seamless loop) -->
              <img src="{% static 'image/brand-1.jpg' %}" alt="TechNova Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-2.jpg' %}" alt="GlobalCorp Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-3.jpg' %}" alt="Nexus Systems Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-4.jpg' %}" alt="Apex Solutions Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-5.jpg' %}" alt="Vertex Group Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
              <img src="{% static 'image/brand-6.jpg' %}" alt="Quantum Dynamics Logo" class="opacity-70 transition-all duration-300 ease-in-out hover:opacity-100">
            </div>
          </div>
        </div>
      </div>
    </section>
